<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Ely Tea Party share card</title>
<style>
  * { box-sizing: border-box }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden }
  body {
    position: relative; color: #eef3ff; font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: radial-gradient(70% 60% at 30% 0%, rgba(90, 150, 255, .35), transparent 70%), linear-gradient(180deg, #1b3e8d 0%, #0d1838 55%, #070b1f 100%);
  }
  .copy { position: absolute; left: 72px; top: 64px; width: 600px }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700 }
  .brand img { width: 52px; height: 52px; border-radius: 12px }
  h1 { margin: 48px 0 26px; font-size: 92px; line-height: 1.1; font-weight: 800; letter-spacing: -2px }
  h1 span { background: linear-gradient(90deg, #a6dcff, #4f86ff 55%, #b09bff); -webkit-background-clip: text; background-clip: text; color: transparent }
  p { margin: 0; font-size: 27px; line-height: 1.5; color: #aab6d4 }
  .meta { margin-top: 30px; display: inline-block; padding: 8px 20px; border-radius: 999px; font-size: 22px; color: #ffcf7a; border: 1px solid rgba(255, 207, 122, .45); background: rgba(7, 11, 31, .4) }
  .party { position: absolute; right: 24px; bottom: 26px; width: 520px; height: 470px }
  .party::after { content: ""; position: absolute; left: 20px; right: 20px; bottom: 6px; height: 90px; border-radius: 50%; background: radial-gradient(closest-side, rgba(79, 134, 255, .5), transparent) }
  .party img { position: absolute; z-index: 1; filter: drop-shadow(0 14px 16px rgba(0, 0, 0, .45)) }
  .whale { width: 330px; left: 95px; bottom: 30px; z-index: 2 }
  .claude { width: 200px; left: -10px; bottom: 16px }
  .gpt { width: 190px; right: -14px; bottom: 20px }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../ELYTerminal/docs/icon.png" alt="">Ely Tea Party</div>
    <h1>代码在跑，<br><span>茶会正好。</span></h1>
    <p>给 Claude Code、Codex、Gemini 们<br>一个有温度的终端。</p>
    <div class="meta">免费开源 · macOS / Windows / Linux</div>
  </div>
  <div class="party">
    <img class="claude" src="../art/cast/claude-working.avif" alt="">
    <img class="whale" src="../art/mascot/whale-idle.avif" alt="">
    <img class="gpt" src="../art/cast/gpt-needs_input.avif" alt="">
  </div>
</body>
</html>
