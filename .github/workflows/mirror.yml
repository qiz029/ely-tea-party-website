name: Mirror

# Copies a newly published app release from GitHub to the R2 download store and counts downloads, then redeploys the site when either changed.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: mirror
        run: node scripts/mirror.mjs
      - id: downloads
        run: node scripts/downloads.mjs
      - name: Redeploy the site with the new downloads
        if: steps.mirror.outputs.published == 'true' || steps.downloads.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
